:root{color-scheme:dark;--ink:#120005;--wine:#3a0014;--crimson:#8d002c;--hot:#ec0050;--pink:#ff86bd;--paper:#fff4f7;--muted:#e4afbf;

*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{min-height:100svh;background:radial-gradient(130% 90% at 84% -8%,var(--wine),var(--ink) 56%),var(--ink);color:var(--paper);font-family:var(--body);overflow-x:hidden;-webkit-tap-highlight-color:transparent;}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;}

.topbar{position:fixed;top:0;left:0;right:0;z-index:80;display:flex;align-items:center;justify-content:space-between;padding:clamp(.9rem,2.5vw,1.4rem) clamp(1.1rem,4vw,2.4rem);background:linear-gradient(180deg,rgba(18,0,5,.7),transparent);}

.lang{display:flex;gap:.55rem;font-family:var(--mono);font-size:.6rem;letter-spacing:.12em;}
.lang button{color:var(--muted);opacity:.7;padding:.2rem 0;position:relative;text-transform:uppercase;}
.lang button.on{color:var(--paper);opacity:1;}
.lang button.on::after{content:"";position:absolute;left:0;right:0;bottom:-3px;height:2px;background:var(--hot);}
.burger{width:34px;height:20px;position:relative;}
.burger span{position:absolute;left:0;right:0;height:2px;background:var(--paper);transition:transform .5s cubic-bezier(.7,0,.2,1),opacity .35s;}
.burger span:nth-child(1){top:0}.burger span:nth-child(2){top:9px}.burger span:nth-child(3){top:18px}

#menu{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;padding:clamp(4.6rem,12vw,6rem) clamp(1.4rem,6vw,4rem) clamp(1.4rem,5vw,3rem);background:rgba(16,0,6,.72);backdrop-filter:blur(20px) saturate(1.15);-webkit-backdrop-filter:blur(20px) saturate(1.15);clip-path:inset(0 0 100% 0);transition:clip-path .7s cubic-bezier(.7,0,.2,1);pointer-events:none;}

#menu .close{position:absolute;top:clamp(1.1rem,3vw,1.8rem);right:clamp(1.1rem,4vw,2.4rem);font-family:var(--mono);font-size:1.4rem;color:var(--paper);}
.menu-list{list-style:none;margin:0;padding:0;flex:1;display:flex;flex-direction:column;justify-content:center;gap:clamp(.1rem,1.4vh,.6rem);}
.menu-list li{overflow:hidden;}
.menu-list a{display:flex;align-items:baseline;gap:1rem;padding:.35rem 0;font-family:var(--display);font-weight:700;text-transform:uppercase;font-size:clamp(2.2rem,8vw,4.4rem);line-height:1.02;letter-spacing:-.01em;color:var(--paper);transform:translateY(115%);transition:transform .6s cubic-bezier(.2,.7,.2,1),color .25s;}
.menu-list a .no{font-family:var(--mono);font-weight:400;font-size:.7rem;letter-spacing:.1em;color:var(--muted);opacity:0;transition:opacity .4s;}

#cheer img{width:100%;display:block;pointer-events:none;user-select:none;-webkit-user-drag:none;}
#cheer::before{content:"";position:absolute;left:50%;top:50%;width:300%;height:300%;transform:translate(-50%,-50%) scale(.4);border-radius:50%;background:radial-gradient(circle,rgba(255,246,250,.5) 0%,rgba(255,170,206,.3) 34%,rgba(236,0,80,.14) 60%,transparent 74%);opacity:0;pointer-events:none;z-index:-1;filter:blur(9px);}
#cheer.waving::before{animation:cheerBurst .9s ease-out both;}
#cheer.waving{filter:drop-shadow(0 0 1.2rem rgba(255,247,250,.55)) drop-shadow(0 .5rem 1rem rgba(18,0,5,.5));}
@keyframes cheerBurst{0%{opacity:0;transform:translate(-50%,-50%) scale(.4)}18%{opacity:.62;transform:translate(-50%,-50%) scale(1)}55%{opacity:.3;transform:translate(-50%,-50%) scale(1.35)}100%{opacity:0;transform:translate(-50%,-50%) scale(1.7)}}
#cheer::after{content:"";position:absolute;left:50%;top:46%;width:185%;height:185%;transform:translate(-50%,-50%) scale(.42) scaleY(.88);background:url("data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%27%20viewBox%3D%27330%205%20228%20312%27%3E%3Cg%20stroke%3D%27%23fff%27%20stroke-width%3D%2746%27%20stroke-linecap%3D%27butt%27%20stroke-linejoin%3D%27miter%27%20fill%3D%27none%27%3E%3Cpath%20d%3D%27M356%20110%20L508%20110%20L366%20286%20L520%20286%27%2F%3E%3Cpath%20d%3D%27M452%2078%20L506%2034%27%2F%3E%3C%2Fg%3E%3C%2Fsvg%3E") center/contain no-repeat;opacity:0;pointer-events:none;z-index:-1;filter:drop-shadow(0 0 8px rgba(255,255,255,.6)) drop-shadow(0 0 20px rgba(255,150,196,.45));}
#cheer.waving::after{animation:cheerZ .92s cubic-bezier(.2,.7,.3,1) both;}
@keyframes cheerZ{0%{opacity:0;transform:translate(-50%,-50%) scale(.42) scaleY(.88)}18%{opacity:.72;transform:translate(-50%,-50%) scale(1) scaleY(.88)}55%{opacity:.5;transform:translate(-50%,-50%) scale(1.2) scaleY(.88)}100%{opacity:0;transform:translate(-50%,-50%) scale(1.55) scaleY(.88)}}

@media (max-width:760px){.lang{display:none;}}
.menu-lang{display:flex;gap:.9rem;margin:0 0 clamp(1rem,3vh,1.6rem);font-family:var(--mono);font-size:.74rem;letter-spacing:.16em;}
.menu-lang button{color:var(--muted);opacity:.7;padding:.3rem .1rem;position:relative;text-transform:uppercase;}
.menu-lang button.on{color:var(--paper);opacity:1;}

.tk-step{animation:tkIn .4s cubic-bezier(.2,.7,.3,1) both;}
@keyframes tkIn{from{opacity:0;transform:translateY(12px);}to{opacity:1;transform:none;}}
.row{transition:background .22s ease,box-shadow .22s ease;}
@media (hover:hover){.row:hover{background:rgba(255,244,247,.03)!important;box-shadow:inset 3px 0 0 var(--hot);}.row:hover .rchev{transform:translateX(4px);color:var(--hot);}.row:hover .rcity{color:var(--pink);}}
.rchev{transition:transform .22s ease,color .22s ease;}
.rcity{transition:color .22s ease;}

.rvrow{animation:rvUp .5s cubic-bezier(.2,.7,.3,1) both;}

.ticket-rules-die{display:grid;place-items:center;width:46px;aspect-ratio:1;background:var(--hot);font-size:1.7rem;line-height:1;box-shadow:.35rem .45rem 1.3rem rgba(18,0,5,.42);}

.ticket-rules li{counter-increment:ticket-rule;display:grid;grid-template-columns:2.1rem 1fr;gap:.2rem;font-size:.74rem;line-height:1.55;color:rgba(255,244,247,.84);}
.ticket-rules li::before{content:"0" counter(ticket-rule);font-family:var(--mono);font-size:.6rem;color:var(--pink);padding-top:.12rem;}
.ticket-rules-foot{margin:.75rem 0 0;padding-top:.65rem;border-top:1px solid rgba(255,134,189,.12);font-family:var(--mono);font-size:.58rem;line-height:1.6;color:var(--muted);}

.tier-option{--tier-accent:var(--pink);position:relative;isolation:isolate;min-height:188px;padding:1rem;overflow:hidden;border:1px solid rgba(255,134,189,.24);border-radius:14px;background:rgba(255,244,247,.028);color:var(--paper);text-align:left;box-shadow:0 .7rem 1.8rem rgba(18,0,5,.28);transition:transform .2s cubic-bezier(.16,1,.3,1),border-color .2s,background .2s,box-shadow .2s;}

.tier-option::after{content:attr(data-die);position:absolute;z-index:-1;right:-.6rem;bottom:-2rem;font-size:7.8rem;line-height:1;color:rgba(255,134,189,.055);}
.tier-top{display:flex;align-items:flex-start;justify-content:space-between;gap:.55rem;}

.tier-seat{display:flex;align-items:center;gap:.42rem;margin-top:.75rem;font-family:var(--mono);font-size:.55rem;line-height:1.45;color:var(--pink);}

.tier-warning{margin:.6rem 0 0;font-size:.66rem;line-height:1.45;color:var(--muted);}
@media (hover:hover){.tier-option:hover{transform:translateY(-3px);border-color:var(--tier-accent);background:rgba(255,244,247,.05);box-shadow:0 1rem 2.2rem rgba(18,0,5,.42);}}
.tier-option:active{transform:scale(.98);}
.tier-option:focus-visible{outline:2px solid var(--paper);outline-offset:3px;}
.confirm-ticket{padding:1rem;border:1px solid rgba(255,134,189,.2);border-radius:14px;background:rgba(23,0,6,.42);}
.confirm-ticket-main{display:flex;align-items:flex-start;justify-content:space-between;gap:1rem;}
.confirm-ticket-name{font-size:1rem;font-weight:700;line-height:1.35;}
.confirm-ticket-meta{margin-top:.35rem;font-family:var(--mono);font-size:.58rem;line-height:1.6;color:var(--muted);}
.confirm-ticket-price{font-family:var(--display);font-size:1.7rem;font-weight:700;line-height:1;color:var(--hot);white-space:nowrap;}
.random-assign{position:relative;margin-top:.85rem;padding:.9rem .9rem .9rem 3.7rem;overflow:hidden;background:var(--wine);box-shadow:.35rem .55rem 1.4rem rgba(18,0,5,.34);}
.random-assign::before{content:"⚄";position:absolute;left:.85rem;top:50%;font-size:2rem;color:var(--pink);transform:translateY(-50%);}
.random-assign b{display:block;font-family:var(--mono);font-size:.62rem;letter-spacing:.08em;color:var(--paper);}
.random-assign p{margin:.3rem 0 0;font-size:.7rem;line-height:1.55;color:var(--muted);}
@media (max-width:560px){.ticket-rules ol{grid-template-columns:1fr;}.ticket-rules li{font-size:.72rem;}.tier-option{min-height:176px;padding:.86rem;}.confirm-ticket-main{gap:.6rem;}.confirm-ticket-price{font-size:1.45rem;}}
@media (max-width:350px){.tier-grid{grid-template-columns:1fr;}.tier-option{min-height:160px;}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.2s!important;}.rvrow,.tk-step{animation:none!important;}}
.foot{padding:clamp(2.4rem,6vh,4rem) clamp(1.2rem,5vw,3.4rem) clamp(3rem,8vh,5rem);border-top:1px solid rgba(255,134,189,.16);display:flex;flex-direction:column;gap:1.6rem;background:var(--ink);position:relative;z-index:2;}

<script>
var b=document.body;
document.getElementById("burger").onclick=function(){b.classList.toggle("menu-open");};

function wave(){if(playing)return;playing=true;cheer.classList.add("waving");var n=0,loops=0;var t=setInterval(function(){cImg.src=frames[n];n++;if(n>=7){n=0;loops++;if(loops>=2){clearInterval(t);cImg.src="assets/cheer-still.webp";playing=false;cheer.classList.remove("waving");}}},80);}

cheer.addEventListener("pointermove",function(e){if(!drag)return;if(Math.abs(e.movementX)+Math.abs(e.movementY)>1)drag.moved=true;var w=cheer.offsetWidth,h=cheer.offsetHeight;var nx=Math.max(4,Math.min(innerWidth-w-4,e.clientX-drag.dx)),ny=Math.max(4,Math.min(innerHeight-h-4,e.clientY-drag.dy));cheer.style.left=nx+"px";cheer.style.top=ny+"px";cheer.style.right="auto";cheer.style.bottom="auto";});
