.menu-foot{display:flex;justify-content:space-between;align-items:flex-end;gap:1rem;flex-wrap:wrap;border-top:1px solid rgba(255,134,189,.16);padding-top:1.2rem;font-family:var(--mono);}

#cheer.waving::after{animation:cheerZ .92s cubic-bezier(.2,.7,.3,1) both;}
@keyframes cheerZ{0%{opacity:0;transform:translate(-50%,-50%) scale(.42) scaleY(.88)}18%{opacity:.72;transform:translate(-50%,-50%) scale(1) scaleY(.88)}55%{opacity:.5;transform:translate(-50%,-50%) scale(1.2) scaleY(.88)}100%{opacity:0;transform:translate(-50%,-50%) scale(1.55) scaleY(.88)}}
.wrap{max-width:960px;margin:0 auto;padding:clamp(5.4rem,13vw,8rem) clamp(1.2rem,5vw,2.6rem) clamp(3rem,8vh,5rem);}

.menu-lang{display:flex;gap:.9rem;margin:0 0 clamp(1rem,3vh,1.6rem);font-family:var(--mono);font-size:.74rem;letter-spacing:.16em;}

.menu-lang button.on{color:var(--paper);opacity:1;}
.menu-lang button.on::after{content:"";position:absolute;left:0;right:0;bottom:-4px;height:2px;background:var(--hot);}

.row{transition:background .22s ease;}

.tour-page-title{margin:0;font-family:var(--display);font-size:clamp(2rem,5vw,2.7rem);font-weight:700;line-height:1;letter-spacing:-.02em;text-transform:uppercase;}

.payment-confirm-actions{display:grid;grid-template-columns:1fr 1.35fr;gap:.65rem;margin-top:1.25rem;}
.payment-confirm-actions button{min-height:2.9rem;border:1px solid rgba(255,244,247,.24);border-radius:10px;background:transparent;color:var(--paper);font-family:var(--mono);font-size:.72rem;font-weight:700;letter-spacing:.08em;cursor:pointer;}
.payment-confirm-actions button:last-child{border-color:var(--hot);background:var(--hot);box-shadow:.35rem .55rem 1.45rem rgba(236,0,80,.32);}
.payment-confirm-actions button:focus-visible{outline:2px solid var(--paper);outline-offset:3px;}
.payment-processing{display:grid;grid-template-columns:auto minmax(0,1fr);align-items:center;gap:.8rem;margin-top:1rem;padding:.9rem;background:var(--wine);}
.payment-processing i{grid-row:1/3;width:2rem;aspect-ratio:1;border:3px solid rgba(255,134,189,.25);border-top-color:var(--paper);border-radius:50%;animation:paymentSpin .9s linear infinite;}
.payment-processing strong{color:var(--paper);font-family:var(--mono);font-size:.7rem;line-height:1.45;}
.payment-processing p{margin:0!important;font-size:.66rem!important;}
@keyframes paymentFade{from{opacity:.55;}to{opacity:1;}}
@keyframes paymentRise{from{transform:translateY(1rem) scale(.98);opacity:.5;}to{transform:none;opacity:1;}}
@keyframes paymentSpin{to{transform:rotate(360deg);}}
@media (max-width:760px){.tour-table-head{display:none;}.tour-continent{padding-top:2.8rem;}.tour-row{grid-template-columns:62px minmax(0,1fr) 14px;gap:.85rem;padding:1.1rem .15rem;}.tour-date{align-self:start;}.tour-place{grid-column:2;}.tour-facts{grid-column:2;grid-row:2;}.tour-time small,.tour-price small{display:block;}.tour-row .rchev{grid-column:3;grid-row:1/3;align-self:center;}.continent-nav{gap:1.35rem;}}
@media (max-width:560px){.ticket-rules ol{grid-template-columns:1fr;}.ticket-rules li{font-size:.72rem;}.tier-option{min-height:154px;padding:.86rem;}.confirm-ticket-main{gap:.6rem;}.confirm-ticket-price{font-size:1.45rem;}.tour-place strong{font-size:1.08rem;}.tour-facts{gap:.7rem;}.tour-time strong,.tour-price strong{font-size:.68rem;}}
@media (max-width:350px){.tier-grid{grid-template-columns:1fr;}.tier-option{min-height:160px;}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.2s!important;}.rvrow,.tk-step{animation:none!important;}}
.foot{padding:clamp(2.4rem,6vh,4rem) clamp(1.2rem,5vw,3.4rem) clamp(3rem,8vh,5rem);border-top:1px solid rgba(255,134,189,.16);display:flex;flex-direction:column;gap:1.6rem;background:var(--ink);position:relative;z-index:2;}
.foot .disc{font-family:var(--mono);font-size:.58rem;line-height:1.95;color:var(--muted);max-width:52rem;margin:0;}
.foot .frow{display:flex;justify-content:space-between;align-items:flex-end;gap:1.2rem;flex-wrap:wrap;}
.foot .cred{display:flex;flex-direction:column;gap:.5rem;font-family:var(--mono);font-size:.72rem;color:var(--paper);}
.foot .cred span{color:var(--pink);font-size:.5rem;letter-spacing:.22em;text-transform:uppercase;margin-right:.7rem;}
.foot .mk{font-family:var(--mono);font-size:.5rem;letter-spacing:.2em;color:var(--muted);opacity:.6;text-transform:uppercase;text-align:right;}
</style>

<button id="cheer" aria-label="应援挥舞荧光棒"><img id="cheerImg" src="assets/cheer-still.webp" alt="荧光棒" /></button>

<script>
var b=document.body;
document.getElementById("burger").onclick=function(){b.classList.toggle("menu-open");};
document.getElementById("close").onclick=function(){b.classList.remove("menu-open");};
document.querySelectorAll("button[data-lang]").forEach(function(btn){btn.onclick=function(){var L=btn.dataset.lang;document.querySelectorAll("button[data-lang]").forEach(function(x){x.classList.toggle("on",x.dataset.lang===L);});window.DiZLang=L;if(window.DiZTicketLang)window.DiZTicketLang(L);};});
var frames=[];for(var i=0;i<7;i++){frames.push("assets/cheer-frame-"+i+".webp");new Image().src=frames[i];}
var cheer=document.getElementById("cheer"),cImg=document.getElementById("cheerImg"),playing=false,drag=null;
function wave(){if(playing)return;playing=true;cheer.classList.add("waving");var n=0,loops=0;var t=setInterval(function(){cImg.src=frames[n];n++;if(n>=7){n=0;loops++;if(loops>=2){clearInterval(t);cImg.src="assets/cheer-still.webp";playing=false;cheer.classList.remove("waving");}}},80);}
cheer.addEventListener("pointerdown",function(e){var r=cheer.getBoundingClientRect();drag={dx:e.clientX-r.left,dy:e.clientY-r.top,moved:false};cheer.setPointerCapture(e.pointerId);});
cheer.addEventListener("pointermove",function(e){if(!drag)return;if(Math.abs(e.movementX)+Math.abs(e.movementY)>1)drag.moved=true;var w=cheer.offsetWidth,h=cheer.offsetHeight;var nx=Math.max(4,Math.min(innerWidth-w-4,e.clientX-drag.dx)),ny=Math.max(4,Math.min(innerHeight-h-4,e.clientY-drag.dy));cheer.style.left=nx+"px";cheer.style.top=ny+"px";cheer.style.right="auto";cheer.style.bottom="auto";});
cheer.addEventListener("pointerup",function(){if(drag&&!drag.moved)wave();drag=null;});
</script>
