    <!--
      The whole page is rendered client-side by script.js, so without this
      the browser can't discover (let alone start fetching) the hero image
      until script.js has downloaded AND run — serializing what should be
      two things loading in parallel. This preload starts the fetch the
      moment the HTML is parsed, same as a static <img> would.
    -->
    <link rel="preload" as="image" href="assets/hero.avif" type="image/avif" fetchpriority="high" />
    <!-- Same reasoning as the hero preload above: without this the cheer
         widget's idle image doesn't start downloading until script.js has
         fully arrived and run, which was the main reason the widget itself
         took several extra seconds to show up after the hero image did. -->
    <link rel="preload" as="image" href="assets/cheer-still.webp" />
