<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" role="img" aria-labelledby="title desc">
  <title id="title">月云的兵限定证书</title>
  <desc id="desc">深红色方形底图，中央写有月云的兵四个字。</desc>
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="75%">
      <stop offset="0" stop-color="#d8134e"/>
      <stop offset=".62" stop-color="#790024"/>
      <stop offset="1" stop-color="#280009"/>
    </radialGradient>
    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M64 0H0V64" fill="none" stroke="#ff86bd" stroke-opacity=".09" stroke-width="2"/>
    </pattern>
  </defs>
  <rect width="800" height="800" rx="48" fill="url(#bg)"/>
