  <path d="M68 118h664M68 682h664" stroke="#ff86bd" stroke-width="3" stroke-opacity=".75"/>
  <text x="400" y="360" fill="#fff4f7" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="142" font-weight="900" text-anchor="middle" letter-spacing="18">月云</text>
  <text x="400" y="535" fill="#fff4f7" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="142" font-weight="900" text-anchor="middle" letter-spacing="18">的兵</text>
  <text x="400" y="635" fill="#ffb3d4" font-family="monospace" font-size="28" font-weight="700" text-anchor="middle" letter-spacing="10">ACHIEVEMENT CERTIFICATE</text>
