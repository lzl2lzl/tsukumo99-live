<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#090909}canvas{display:block;width:100%;height:100%}</style></head><body><canvas id="flow"></canvas><script>
(()=>{const c=document.querySelector('#flow'),g=c.getContext('2d'),reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;let w,h,dpr,t=0,raf,visible=true;function resize(){dpr=Math.min(devicePixelRatio||1,1.5);w=innerWidth;h=innerHeight;c.width=w*dpr;c.height=h*dpr;g.setTransform(dpr,0,0,dpr,0,0)}function line(depth,row,time){const horizon=h*.32,baseY=horizon+Math.pow(row/18,1.75)*h*.86,spread=1+depth*.22;g.beginPath();for(let x=-80;x<=w+80;x+=18){const nx=x/w;const wave=Math.sin(nx*6.2+time*.28+depth)*12*(row/18);const y=baseY+wave;const px=w/2+(x-w/2)*spread;g.lineTo(px,y)}g.stroke()}function draw(){g.clearRect(0,0,w,h);g.fillStyle='#090909';g.fillRect(0,0,w,h);g.save();g.globalCompositeOperation='screen';for(let d=0;d<3;d++){g.strokeStyle=`rgba(255,255,255,${.055+d*.025})`;g.lineWidth=1;for(let r=0;r<19;r++)line(d,r,t*(1+d*.37));const horizon=h*.32;for(let col=-14;col<=14;col++){g.beginPath();for(let r=0;r<=18;r++){const q=r/18,y=horizon+Math.pow(q,1.75)*h*.86;const spacing=(20+q*w*.055)*(1+d*.18);const x=w/2+col*spacing+Math.sin(t*.22+d+q*3)*9*q;g.lineTo(x,y)}g.stroke()}}const scan=(Math.sin(t*.42)*.5+.5)*w;const grd=g.createLinearGradient(scan-180,0,scan+180,0);grd.addColorStop(0,'transparent');grd.addColorStop(.5,'rgba(255,255,255,.16)');grd.addColorStop(1,'transparent');g.fillStyle=grd;g.fillRect(0,0,w,h);g.restore();if(!reduce)t+=.016;if(visible)raf=requestAnimationFrame(draw)}resize();addEventListener('resize',resize);document.addEventListener('visibilitychange',()=>{visible=!document.hidden;if(visible)draw();else cancelAnimationFrame(raf)});draw()})();
</script></body></html>
