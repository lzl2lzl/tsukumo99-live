<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#7d7d7d}.stage{position:relative;width:100%;height:100%;isolation:isolate;overflow:hidden}.sample{position:absolute;inset:0;display:grid;place-items:center;font:900 20vw/1 Arial,sans-serif;color:#202020;background:linear-gradient(115deg,#bdbdbd,#5e5e5e);letter-spacing:-.08em}.light-wrap,.light-wrap-back{position:absolute;inset:0;pointer-events:none}.light-wrap{z-index:3;mix-blend-mode:soft-light}.light-wrap-back{z-index:-1}.center{position:absolute;top:50%;left:0;width:0;height:0}.orb{position:absolute;top:50%;left:50%;width:60vw;height:60vw;border-radius:50%;transform:translate(-50%,-50%);transform-origin:top left;background:#fff;opacity:.6;animation:pulse 5s linear infinite alternate}.light-wrap-back .orb{background:#fffbe0;opacity:1}@keyframes pulse{from{scale:.35}to{scale:1}}@media(max-width:820px){.orb{animation-name:pulse-mobile}@keyframes pulse-mobile{from{scale:.8}to{scale:1.3}}}@media(prefers-reduced-motion:reduce){.orb{animation:none;scale:.7}}
</style></head><body><div class="stage"><div class="light-wrap-back"><div class="center"><div class="orb"></div></div></div><div class="sample">TEST</div><div class="light-wrap"><div class="center"><div class="orb"></div></div></div></div><script>
(()=>{const centers=[...document.querySelectorAll('.center')],reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;let a=-.75,b=0,raf;if(reduce){centers.forEach(c=>c.style.translate='50vw 0');return}function tick(){const mobile=innerWidth<=820,da=mobile?.02:.012;a+=da;b+=da*2;const x=(Math.sin(a)+1)*.5*innerWidth,y=Math.cos(b)*innerHeight*.5;centers.forEach(c=>c.style.translate=`${x}px ${y}px`);raf=requestAnimationFrame(tick)}document.addEventListener('visibilitychange',()=>document.hidden?cancelAnimationFrame(raf):tick());tick()})();
</script></body></html>
