<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#ff552b}canvas{display:block;width:100%;height:100%;background:#ff552b}</style></head><body><canvas id="c"></canvas><script>
(()=>{const c=document.querySelector('#c'),g=c.getContext('2d'),reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;const planes=[{x:-.06,y:-.15,w:.38,h:.52,cell:86,speed:10/6},{x:.30,y:-.08,w:.49,h:.56,cell:64,speed:10/1.5},{x:.70,y:-.02,w:.36,h:.50,cell:42,speed:10},{x:.03,y:.48,w:.47,h:.55,cell:32,speed:5},{x:.50,y:.43,w:.56,h:.63,cell:76,speed:2.5}];let w,h,dpr,t=0,raf,active=true;function resize(){dpr=Math.min(devicePixelRatio||1,1.5);w=innerWidth;h=innerHeight;c.width=w*dpr;c.height=h*dpr;g.setTransform(dpr,0,0,dpr,0,0)}function grid(p,copy){const x=p.x*w+copy*w,y=p.y*h,W=p.w*w,H=p.h*h,cell=p.cell*(w/1440);g.save();g.beginPath();g.rect(x,y,W,H);g.clip();g.fillStyle='#ff552b';g.fillRect(x,y,W,H);g.strokeStyle='rgba(231,36,24,.78)';g.lineWidth=Math.max(1,w/1440*1.4);for(let xx=x-(x%cell);xx<x+W+cell;xx+=cell){g.beginPath();g.moveTo(xx,y);g.lineTo(xx,y+H);g.stroke()}for(let yy=y-(y%cell);yy<y+H+cell;yy+=cell){g.beginPath();g.moveTo(x,yy);g.lineTo(x+W,yy);g.stroke()}const loop=4.4,scan=((t*.4*p.speed)%loop)-2.2,pos=x+W*((scan+2.2)/loop);const grd=g.createLinearGradient(pos-W*.28,0,pos+W*.28,0);grd.addColorStop(0,'rgba(255,255,255,0)');grd.addColorStop(.46,'rgba(255,255,255,.88)');grd.addColorStop(.54,'rgba(255,255,255,.92)');grd.addColorStop(1,'rgba(255,255,255,0)');g.globalCompositeOperation='screen';g.fillStyle=grd;g.fillRect(x,y,W,H);g.restore()}function noise(){g.save();g.globalCompositeOperation='multiply';g.globalAlpha=.075;for(let i=0;i<800;i++){g.fillStyle=i%2?'#6a180e':'#fff';g.fillRect((i*73+t*260)%w,(i*47)%h,1,1)}g.restore()}function draw(){g.clearRect(0,0,w,h);g.fillStyle='#ff552b';g.fillRect(0,0,w,h);const drift=reduce?0:(t*.2*.001*w)%w;g.save();g.translate(drift,0);for(const p of planes){grid(p,-1);grid(p,0);grid(p,1)}g.restore();noise();if(!reduce)t+=1/60;if(active)raf=requestAnimationFrame(draw)}resize();addEventListener('resize',resize);document.addEventListener('visibilitychange',()=>{active=!document.hidden;active?draw():cancelAnimationFrame(raf)});draw()})();
</script></body></html>
