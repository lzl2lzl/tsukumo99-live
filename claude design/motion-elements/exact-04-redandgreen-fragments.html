<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080808}canvas{display:block;width:100%;height:100%}</style></head><body><canvas id="out"></canvas><script>
(()=>{const out=document.querySelector('#out'),g=out.getContext('2d'),src=document.createElement('canvas'),s=src.getContext('2d'),reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;let w,h,dpr,t=0,raf,active=true;const tiles=Array.from({length:36},(_,i)=>({col:i%6,row:(i/6)|0,rx:Math.random()*2-1,ry:Math.random()*2-1,rz:Math.random()*2-1,sx:.3+Math.random()*.7,sy:.3+Math.random()*.7,phase:Math.random()*Math.PI*2,green:Math.random()>.5}));function resize(){dpr=Math.min(devicePixelRatio||1,1.5);w=innerWidth;h=innerHeight;out.width=w*dpr;out.height=h*dpr;g.setTransform(dpr,0,0,dpr,0,0);src.width=1280;src.height=800}function texture(){const W=src.width,H=src.height;s.fillStyle='#101010';s.fillRect(0,0,W,H);for(let y=0;y<H;y+=8){const bend=Math.tan(t*.23+y/H*1.8)*7;s.fillStyle=`hsl(0 0% ${28+22*Math.sin(y*.025-t*1.7)}%)`;s.fillRect(bend,y,W,8)}s.save();s.translate(W*.5,H*.5);s.rotate(Math.sin(t*.17)*.08);s.fillStyle='#ededed';s.font='900 260px Arial Black,Arial';s.textAlign='center';s.textBaseline='middle';s.fillText('MOTION',0,-80);s.fillStyle='#777';s.fillText('FIELD',0,170);s.restore()}function n(x,y,z){return Math.sin(x*1.7+Math.sin(y*1.3+z))*Math.cos(y*1.1-Math.sin(z*.7+x))}function tile(q){const baseX=(q.col+.5)/6*w,baseY=(q.row+.5)/6*h,tw=w/6+1,th=h/6+1,amp=Math.min(w,h)*.34*(reduce?0:1),dx=(Math.sin(q.phase+t*q.sx*2.4)*.52+n(q.rx,q.ry,t*.5))*amp,dy=(Math.sin(q.phase*1.7+t*q.sy*2.1)*.5+n(q.ry,q.rz,t*.45))*amp,rot=Math.sin(q.phase+t*q.sx)*.22*(reduce?0:1),scale=.92+.12*Math.sin(q.phase+t*q.sy),sx=q.col/6*src.width,sy=q.row/6*src.height,sw=src.width/6,sh=src.height/6;g.save();g.translate(baseX+dx,baseY+dy);g.rotate(rot);g.scale(scale,scale);g.beginPath();g.rect(-tw/2,-th/2,tw,th);g.clip();g.filter='grayscale(1) contrast(1.12)';g.drawImage(src,sx,sy,sw,sh,-tw/2,-th/2,tw,th);g.globalCompositeOperation='screen';g.globalAlpha=.12;g.fillStyle=q.green?'#3cb500':'#e20000';g.fillRect(-tw/2,-th/2,tw,th);g.restore()}function draw(){g.clearRect(0,0,w,h);g.fillStyle='#080808';g.fillRect(0,0,w,h);texture();tiles.forEach(tile);if(!reduce)t+=1/60;if(active)raf=requestAnimationFrame(draw)}resize();addEventListener('resize',resize);document.addEventListener('visibilitychange',()=>{active=!document.hidden;active?draw():cancelAnimationFrame(raf)});draw()})();
</script></body></html>
