</style></head><body><div class="field" id="field"></div><script>
const words=['DICE AWAY','ONCE AND FOR ALL','TSUKUMO99','DiŹ','ALL IN','WINNER TAKES ALL','ROLL','WORLD TOUR','NO GODS','LAST BET','GO ALL IN'];const field=document.querySelector('#field');for(let r=0;r<15;r++){const row=document.createElement('div');row.className='row';const inner=document.createElement('div');inner.className='inner';const seq=Array.from({length:12},(_,k)=>words[(r*3+k)%words.length]).join(' · ')+' · ';inner.textContent=seq+seq+seq;inner.style.animation=`drift ${(12+r*1.7).toFixed(1)}s linear infinite ${r%2?'reverse':'normal'}`;row.appendChild(inner);field.appendChild(row)}
