<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#090909}.fx{position:relative;width:100%;height:100%;overflow:hidden;isolation:isolate}.haze{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 100%,rgba(255,255,255,.08),transparent 55%)}.beam{--angle:0deg;--duration:11s;position:absolute;top:-55%;left:50%;width:15vmin;height:175%;transform-origin:50% 0;clip-path:polygon(43% 0,57% 0,100% 100%,0 100%);background:linear-gradient(180deg,rgba(255,255,255,.48),rgba(255,255,255,.13) 45%,transparent 84%);filter:blur(16px);mix-blend-mode:screen;opacity:.68;animation:sway var(--duration) cubic-bezier(.45,.05,.55,.95) infinite alternate;will-change:transform}.beam::after{content:"";position:absolute;inset:0 38%;background:linear-gradient(rgba(255,255,255,.72),transparent 74%);filter:blur(7px)}.a{left:32%;--angle:17deg;--duration:10s}.b{left:74%;width:10vmin;opacity:.4;--angle:-23deg;--duration:14s;animation-delay:-4s}.pool{position:absolute;left:13%;right:13%;bottom:-18%;height:43%;border-radius:50%;background:radial-gradient(ellipse,rgba(255,255,255,.2),rgba(255,255,255,.055) 42%,transparent 72%);filter:blur(18px);animation:breathe 5s ease-in-out infinite alternate}@keyframes sway{0%{transform:translateX(calc(var(--mx,0)*.04px)) rotate(calc(var(--angle) - 8deg)) scaleX(.85)}53%{transform:translateX(calc(var(--mx,0)*.04px)) rotate(calc(var(--angle) + 6deg)) scaleX(1.06)}100%{transform:translateX(calc(var(--mx,0)*.04px)) rotate(calc(var(--angle) - 2deg)) scaleX(.93)}}@keyframes breathe{to{opacity:.58;transform:scale(1.08)}}@media(prefers-reduced-motion:reduce){.beam,.pool{animation:none}}
</style></head><body><div class="fx" id="fx"><div class="haze"></div><div class="beam a"></div><div class="beam b"></div><div class="pool"></div></div><script>
const fx=document.querySelector('#fx');if(!matchMedia('(prefers-reduced-motion:reduce)').matches){let x=0,target=0,raf;const tick=()=>{x+=(target-x)*.045;fx.style.setProperty('--mx',x);raf=requestAnimationFrame(tick)};addEventListener('pointermove',e=>target=e.clientX-innerWidth/2,{passive:true});addEventListener('pointerleave',()=>target=0);document.addEventListener('visibilitychange',()=>{if(document.hidden)cancelAnimationFrame(raf);else tick()});tick()}
</script></body></html>
